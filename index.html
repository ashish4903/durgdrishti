<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111a17" media="(prefers-color-scheme: dark)" />
    <!-- Apply a saved light/dark choice before the page draws, so it never flashes the other
         theme. Keep in step with src/lib/theme.js (key and values). -->
    <script>
      try {
        var savedTheme = localStorage.getItem('durgdrishti-theme-v1');
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (error) { /* storage blocked: follow the device */ }
    </script>
    <meta name="description" content="Forecast bottleneck queues across Maharashtra’s historic forts, discover crowd-free alternate trails, and identify unfortified peaks instantly using AI photo analysis." />
    <title>DurgDrishti — Fort &amp; Trail Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (WhatsApp, LinkedIn, X, …). Image and URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DurgDrishti" />
    <meta property="og:title" content="DurgDrishti — Fort &amp; Trail Intelligence" />
    <meta property="og:description" content="Explore Maharashtra’s forts and plan crowd-aware Sahyadri treks. In English, मराठी and हिंदी." />
    <meta property="og:url" content="https://mrajat31.github.io/durgdrishti/" />
    <meta property="og:image" content="https://mrajat31.github.io/durgdrishti/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DurgDrishti — Fort &amp; Trail Intelligence, Maharashtra" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="mr_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
